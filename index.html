<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N.O.D.E. - Credenciais</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 100%; max-width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h2 { text-align: center; margin-bottom: 20px; color: #00e676; }
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaa; }
    input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; outline: none; }
    input:focus { border-color: #00e676; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #00e676; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background: #00c853; }
    .toggle { text-align: center; margin-top: 15px; font-size: 13px; color: #aaa; cursor: pointer; }
    .toggle span { color: #00e676; text-decoration: underline; }
    .hidden { display: none; }
    .msg { text-align: center; margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="card" id="auth-box">
    <h2 id="form-title">Login</h2>
    
    <div class="input-group">
      <label>Usuário</label>
      <input type="text" id="username" placeholder="Digite seu usuário">
    </div>

    <div class="input-group">
      <label>Senha</label>
      <input type="password" id="password" placeholder="Digite sua senha">
    </div>

    <button id="btn-submit" onclick="autenticar()">Entrar</button>

    <div class="msg" id="message"></div>

    <div class="toggle" id="toggle-link" onclick="alternarTela()">
      Não tem conta? <span>Cadastrar-se</span>
    </div>
  </div>

  <div class="card hidden" id="app-content">
    <h2>N.O.D.E.</h2>
    <p style="text-align: center; margin-bottom: 20px;">Bem-vindo(a) ao sistema!</p>
    <button onclick="deslogar()" style="background: #ff5252; color: #fff;">Sair</button>
  </div>

  <script>
    let modoCadastro = false;

    function alternarTela() {
      modoCadastro = !modoCadastro;
      document.getElementById('form-title').innerText = modoCadastro ? 'Criar Conta' : 'Login';
      document.getElementById('btn-submit').innerText = modoCadastro ? 'Cadastrar' : 'Entrar';
      document.getElementById('toggle-link').innerHTML = modoCadastro 
        ? 'Já tem conta? <span>Fazer Login</span>' 
        : 'Não tem conta? <span>Cadastrar-se</span>';
      document.getElementById('message').innerText = '';
    }

    function autenticar() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const msg = document.getElementById('message');

      if (!user || !pass) {
        msg.style.color = '#ff5252';
        msg.innerText = 'Preencha todos os campos!';
        return;
      }

      const contas = JSON.parse(localStorage.getItem('node_users') || '{}');

      if (modoCadastro) {
        if (contas[user]) {
          msg.style.color = '#ff5252';
          msg.innerText = 'Usuário já existe!';
        } else {
          contas[user] = pass;
          localStorage.setItem('node_users', JSON.stringify(contas));
          msg.style.color = '#00e676';
          msg.innerText = 'Conta criada com sucesso! Faça login.';
          alternarTela();
        }
      } else {
        if (contas[user] && contas[user] === pass) {
          localStorage.setItem('node_logged', user);
          mostrarPainel();
        } else {
          msg.style.color = '#ff5252';
          msg.innerText = 'Usuário ou senha incorretos!';
        }
      }
    }

    function mostrarPainel() {
      document.getElementById('auth-box').classList.add('hidden');
      document.getElementById('app-content').classList.remove('hidden');
    }

    function deslogar() {
      localStorage.removeItem('node_logged');
      document.getElementById('auth-box').classList.remove('hidden');
      document.getElementById('app-content').classList.add('hidden');
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('message').innerText = '';
    }

    // Verificar se já está logado ao abrir
    if (localStorage.getItem('node_logged')) {
      mostrarPainel();
    }

    // Registrar Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
